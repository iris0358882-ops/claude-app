name: XiaoGuanJia
options:
  bundleIdPrefix: io.github.iris0358882
  deploymentTarget:
    iOS: "16.0"
targets:
  XiaoGuanJia:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Claude
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: 用來查你所在地的天氣
        NSCameraUsageDescription: 讓你拍照傳給我
        NSPhotoLibraryUsageDescription: 讓你選照片傳給我
        NSMicrophoneUsageDescription: 讓你用語音跟我說話
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iris0358882.xiaoguanjia
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
